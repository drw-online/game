<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>神域仙境 玩家工具</title>
<meta name="description" content="神域仙境的玩家查詢工具集。">
<meta name="color-scheme" content="light dark">
<meta property="og:type" content="website">
<meta property="og:site_name" content="神域仙境">
<meta property="og:title" content="神域仙境 玩家工具">
<meta property="og:description" content="神域仙境的玩家查詢工具集。">
<meta property="og:image" content="https://drw-online.github.io/game/og.jpg">
<meta property="og:image:width" content="600">
<meta property="og:image:height" content="600">
<meta name="twitter:card" content="summary">
<meta name="theme-color" content="#EFF1EC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121615" media="(prefers-color-scheme: dark)">
<link rel="icon" href="favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;700;900&display=swap">
<style>
:root{
  --ground:#EFF1EC; --paper:#F8F9F6; --sunk:#E5E8E1;
  --ink:#1F2422; --ink-soft:#5A625E; --ink-faint:#8B948F;
  --rule:#D3D8D0; --rule-soft:#E1E5DC;
  --cinnabar:#B8331C; --cinnabar-wash:#B8331C1A;
  --focus:#B8331C;
  --shadow:0 1px 2px #1f242212, 0 6px 18px #1f24220a;
  --shadow-lift:0 2px 4px #1f242216, 0 14px 34px #1f242212;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#121615; --paper:#1A201E; --sunk:#0D100F;
    --ink:#E4E8E3; --ink-soft:#9AA4A0; --ink-faint:#6E7873;
    --rule:#2A322F; --rule-soft:#222A27;
    --cinnabar:#E0654A; --cinnabar-wash:#E0654A22;
    --focus:#E0654A;
    --shadow:0 1px 2px #00000040, 0 6px 18px #00000030;
    --shadow-lift:0 2px 6px #00000055, 0 14px 34px #00000045;
  }
}
:root[data-theme="dark"]{
  --ground:#121615; --paper:#1A201E; --sunk:#0D100F;
  --ink:#E4E8E3; --ink-soft:#9AA4A0; --ink-faint:#6E7873;
  --rule:#2A322F; --rule-soft:#222A27;
  --cinnabar:#E0654A; --cinnabar-wash:#E0654A22;
  --focus:#E0654A;
  --shadow:0 1px 2px #00000040, 0 6px 18px #00000030;
  --shadow-lift:0 2px 6px #00000055, 0 14px 34px #00000045;
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  font-size:15px; line-height:1.65; -webkit-font-smoothing:antialiased;
}
.wrap{max-width:920px; margin:0 auto; padding:0 20px 80px}

.masthead{padding:64px 0 34px; border-bottom:1px solid var(--rule);
  display:flex; align-items:center; gap:38px}
.brand{min-width:0}
.logo{width:190px; height:auto; flex:none; display:block}
.eyebrow{margin:0 0 12px; font-size:12px; letter-spacing:.34em; color:var(--cinnabar); font-weight:700}
h1{
  margin:0; font-family:"Noto Serif TC",serif; font-weight:900;
  font-size:clamp(36px,7vw,58px); line-height:1.1; letter-spacing:.08em; text-wrap:balance;
}
.lede{margin:16px 0 0; max-width:56ch; color:var(--ink-soft)}

.tools{list-style:none; margin:34px 0 0; padding:0; display:grid; gap:16px; grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.tool a{
  display:flex; flex-direction:column; gap:9px; height:100%;
  padding:24px 24px 22px; text-decoration:none; color:inherit;
  background:var(--paper); border:1px solid var(--rule-soft); border-radius:6px;
  box-shadow:var(--shadow);
  transition:transform .14s ease, box-shadow .14s ease, border-color .14s ease;
}
.tool a:hover{transform:translateY(-3px); box-shadow:var(--shadow-lift); border-color:var(--cinnabar)}
.tool a:focus-visible{outline:2px solid var(--focus); outline-offset:3px}
.t-name{font-family:"Noto Serif TC",serif; font-size:25px; font-weight:700; letter-spacing:.08em; line-height:1.25}
.t-desc{color:var(--ink-soft); font-size:14px; line-height:1.7}
.t-meta{margin-top:auto; padding-top:12px; display:flex; flex-wrap:wrap; gap:7px}
.pill{font-size:12px; letter-spacing:.04em; padding:2px 10px; border-radius:100px; background:var(--sunk); color:var(--ink-soft)}
.pill.key{background:var(--cinnabar-wash); color:var(--cinnabar)}
.go{display:inline-flex; align-items:center; gap:6px; margin-top:14px; color:var(--cinnabar); font-size:13px; font-weight:500; letter-spacing:.06em}

.foot{margin-top:52px; padding-top:20px; border-top:1px solid var(--rule); font-size:12.5px; line-height:1.8; color:var(--ink-faint)}

@media (max-width:640px){
  .masthead{padding:40px 0 26px; flex-direction:column; align-items:flex-start; gap:22px}
  .logo{width:140px}
  .tools{grid-template-columns:1fr}
}
@media (prefers-reduced-motion: reduce){
  *{transition:none !important}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="masthead">
    <img class="logo" src="logo.webp" width="440" height="440" alt="神域仙境" decoding="async">
    <div class="brand">
      <h1>玩家工具</h1>
      <p class="lede">伺服器自製系統的查詢頁。資料取自線上實際設定，系統改動後會一併更新。</p>
    </div>
  </header>

  <ul class="tools">
    <li class="tool">
      <a href="runewords.html">
        <span class="t-name">符文之語圖鑑</span>
        <span class="t-desc">三十三種符文能組出 290 組符文之語。可依符文、洞數與裝備部位篩選，附完整效果與連帶觸發的組合。</span>
        <span class="t-meta">
          <span class="pill key">290 組</span>
          <span class="pill">33 種符文</span>
          <span class="pill">2～6 洞</span>
        </span>
        <span class="go">開啟 →</span>
      </a>
    </li>
  </ul>

  <footer class="foot">
    資料以伺服器實際設定為準。若頁面內容與遊戲內不符，請以遊戲內為準並回報管理員。
  </footer>
</div>
</body>
</html>
